[project]
name = "py-core"
version = "0.1.0"
description = "Python core utilities and tools"
readme = "README.md"
authors = [
    { name = "Dilan Çiçek", email = "dilancicek335@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
py-core = "py_core:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
strict = true
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
